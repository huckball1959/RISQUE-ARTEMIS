  <script>
    (function () {
      try {
        if (typeof window !== "undefined" && window.risqueDisplayIsPublic) return;
        var resumeQuery = false;
        try {
          resumeQuery = new URL(window.location.href).searchParams.get("risqueResumePeriodicCheckpoint") === "1";
        } catch (eQ) {
          /* ignore */
        }
        /* Periodic restart: LS flag and/or launcher ?risqueResumePeriodicCheckpoint=1 (sync disk read; async retry in risqueLocalDiskTryApplyPeriodicRestartCheckpoint). */
        if (localStorage.getItem("risqueAutoResumeCardplayAfterLauncherRestart") !== "1" && !resumeQuery) return;
        function readDiskTextSync(relPath) {
          try {
            var port = 5599;
            try {
              var dp = new URL(window.location.href).searchParams.get("diskPort");
              if (dp) {
                var n = parseInt(dp, 10);
                if (n > 0 && n < 65536) port = n;
              }
            } catch (e0) {}
            var xhr = new XMLHttpRequest();
            xhr.open("POST", "http://127.0.0.1:" + port + "/api/read", false);
            xhr.setRequestHeader("Content-Type", "application/json");
            xhr.send(JSON.stringify({ path: String(relPath || "").replace(/^\/+/, "") }));
            if (xhr.status < 200 || xhr.status >= 300) return "";
            var j = JSON.parse(String(xhr.responseText || "{}"));
            if (!j || !j.ok || j.content == null) return "";
            return String(j.content);
          } catch (e1) {
            return "";
          }
        }
        var fromDisk = readDiskTextSync("risque-periodic-restart-game.json");
        var raw = "";
        if (fromDisk) {
          raw = fromDisk;
          try {
            localStorage.setItem("gameState", raw);
          } catch (eLs0) {}
        }
        if (!raw) {
          raw = localStorage.getItem("gameState");
        }
        if (!raw) {
          try {
            localStorage.removeItem("risqueAutoResumeCardplayAfterLauncherRestart");
          } catch (eRm0) {}
          return;
        }
        var gs = JSON.parse(raw);
        if (!gs || gs.phase !== "cardplay" || !gs.players || !gs.players.length) {
          try {
            localStorage.removeItem("risqueAutoResumeCardplayAfterLauncherRestart");
          } catch (eRm1) {}
          return;
        }
        localStorage.removeItem("risqueAutoResumeCardplayAfterLauncherRestart");
        var rd = "";
        try {
          rd = new URL(window.location.href).searchParams.get("replayDebug") || "";
        } catch (eRd2) {
          /* ignore */
        }
        /* Omit postReceive=1 so cardplay shows tablet handoff (same device after launcher restart is a new browser session). */
        var target = "game.html?phase=cardplay&legacyNext=income.html";
        if (rd === "1" || rd === "0") target += "&replayDebug=" + rd;
        window.location.replace(target);
      } catch (eResume) {
        try {
          localStorage.removeItem("risqueAutoResumeCardplayAfterLauncherRestart");
        } catch (eRm) {
          /* ignore */
        }
      }
    })();

    (function () {
      var isArtemis = !!(window.risqueArtemisHost || window.risqueArtemisNetClient);

      if (!isArtemis && !isPublic) return;

      window.risqueArtemisScheduleLayoutSync = function () {
        if (window.gameUtils && typeof window.gameUtils.resizeCanvas === "function") {
          requestAnimationFrame(function () {
            window.gameUtils.resizeCanvas();
          });
        }
        if (window.risqueRuntimeHud && typeof window.risqueRuntimeHud.syncPosition === "function") {

      var bar = document.getElementById(isArtemis ? "risque-artemis-top-bar" : "risque-public-tv-bar");
      if (!btn) return;

      function wireFullscreen() {
        function syncLabel() {
          var fs = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
          btn.textContent = fs ? "Exit fullscreen" : "Fullscreen";
          btn.setAttribute("aria-pressed", fs ? "true" : "false");
          if (isArtemis) {
            document.documentElement.classList.toggle("risque-artemis-fullscreen-active", !!fs);
          } else if (bar) {
            bar.classList.toggle("risque-artemis-fs-dock--active", !!fs);
          }
          if (window.gameUtils && typeof window.gameUtils.resizeCanvas === "function") {
            requestAnimationFrame(function () {
              window.gameUtils.resizeCanvas();
            });
          }
          if (typeof window.risqueArtemisScheduleLayoutSync === "function") {
            window.risqueArtemisScheduleLayoutSync();
          }
        }

        function requestFullscreenDoc() {
          var doc = document.documentElement;
          var req = doc.requestFullscreen || doc.webkitRequestFullscreen || doc.msRequestFullscreen;
          if (!req) return Promise.reject();
          return Promise.resolve(req.call(doc)).then(syncLabel);
        }

        function exitFullscreenDoc() {
          var ex = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
          if (!ex) return Promise.resolve();
          return Promise.resolve(ex.call(document)).then(syncLabel);
        }

        function toggleFullscreenFromGesture() {
          var fs = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
          if (!fs) {
            return requestFullscreenDoc().catch(function () {});
          }
          return exitFullscreenDoc().catch(function () {});
        }

        function shortcutBlockedTarget(t) {
          var tag = t && t.tagName ? String(t.tagName).toLowerCase() : "";
          return tag === "input" || tag === "textarea" || tag === "select" || (t && t.isContentEditable);
        }

        btn.addEventListener("click", function () {
          toggleFullscreenFromGesture();
        });

        document.addEventListener(
          "keydown",
          function (e) {
            var ctrlShiftF =
              e.ctrlKey && e.shiftKey && !e.altKey && (e.key === "f" || e.key === "F");
            if (ctrlShiftF) {
              if (shortcutBlockedTarget(e.target)) return;
              e.preventDefault();
              e.stopPropagation();

              return;
            }
            if (e.key !== "F11") return;
            if (shortcutBlockedTarget(e.target)) return;
            e.preventDefault();
            e.stopPropagation();
            toggleFullscreenFromGesture();
          },
          true
        );

        document.addEventListener("fullscreenchange", syncLabel);
        document.addEventListener("webkitfullscreenchange", syncLabel);
        document.addEventListener("MSFullscreenChange", syncLabel);
        syncLabel();

        if (isPublic && !isArtemis) {
          function isHttpLike() {
            return window.location.protocol === "http:" || window.location.protocol === "https:";

                return;
              }
              toggleFullscreenFromGesture();
            });
          }
        }
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", wireFullscreen);
      } else {
        wireFullscreen();
      }
    })();
